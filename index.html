<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGT48 シアターの女神 ポジション割り当て</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202124;background:#f5f6f8}body{max-width:900px;margin:0 auto;padding:20px}h1{font-size:1.5rem}p{line-height:1.6}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #00000008}label{display:block;font-weight:650;margin-bottom:8px}textarea{box-sizing:border-box;width:100%;min-height:150px;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}button{background:#1769aa;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;margin-top:12px}button.secondary{background:#e8eef5;color:#17324d;margin-left:8px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb}th{background:#f0f3f7} .muted{color:#5f6368;font-size:.92rem}.pill{display:inline-block;border-radius:999px;padding:3px 9px;background:#e6f4ea;color:#137333;font-size:.85rem}.warn{background:#fff4e5;color:#8a4b00;padding:10px;border-radius:8px}.err{color:#b3261e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:12px}th,td{padding:8px 5px;font-size:.9rem}}
</style></head><body>
<h1>NGT48「シアターの女神」ポジション自動割り当て</h1>
<p class="muted">登録済みの優先順位をもとに、同じポジションが重複しないように割り当てます。現在は、本ポジション別のアンダー優先順位をもとに割り当てます。（最終更新：26/11/12）</p>
<div class="card"><label for="performers">今回の出演メンバー</label><textarea id="performers" placeholder="メンバー名を1行ずつ、または「、」「,」区切りで入力"></textarea><div><button id="run">割り当て開始</button></div><p class="muted">優先順位データがないメンバーや、希望ポジションを割り当てられないメンバーは「オリジナル」と表示します。</p></div>
<div class="card" id="result"><h2>割り当て結果</h2><p class="muted">出演メンバーを入力して「割り当て開始」を押してください。</p></div>
<div class="card"><h2>本ポジション別アンダー優先順位</h2><div id="prefs"></div></div>
<script>
const prefs={
'木本杏菜':['水津菜月','北村優羽','佐藤海里'],
'佐藤広花':['北村優羽','藤崎未夢','鈴木凛々花','三村妃乃','木本優菜',],
'新沢葵唯':['西潟茉莉奈','杉本萌'],
'高島柚愛':['磯部瑠紅','三村妃乃'],
'西川晴菜':['杉本萌'],
'安座間結':['北村優羽','水津菜月'],
'阿達夢':['喜多花恵','清司麗菜'],
'甲斐瑞季':['鈴木凛々花','磯部瑠紅','佐藤海里'],
'北澤百音':['水津菜月','鈴木凛々花'],
'佐藤柚花':['佐藤海里'],
'皆川日和':['三村妃乃','木本優菜'],
'磯崎菜々':['喜多花恵','大塚七海','木本優菜'],
'北村優羽':['藤崎未夢']
};
// 本ポジション側のアンダー優先順位（2026/11/12更新）
const positionPrefs={
'清司麗菜':['阿達夢'],
'西潟茉莉奈':['新沢葵唯'],
'大塚七海':['磯崎菜々'],
'佐藤海里':['佐藤柚花','甲斐瑞季','木本杏菜'],
'三村妃乃':['皆川日和','高島柚愛','佐藤広花'],
'藤崎未夢':['北村優羽','佐藤広花'],
'北村優羽':['佐藤広花','安座間結','木本杏菜'],
'水津菜月':['木本杏菜','安座間結','北澤百音'],
'木本優菜':['磯崎菜々','皆川日和','佐藤広花'],
'鈴木凛々花':['甲斐瑞季','佐藤広花','北澤百音'],
'杉本萌':['西川晴菜','新沢葵唯'],
'磯部瑠紅':['高島柚愛','甲斐瑞季'],
'喜多花恵':['阿達夢','磯崎菜々']
};
const allPositions=Object.keys(positionPrefs);
function splitNames(s){return [...new Set(s.split(/[、,，\n\r・;；]+/).map(x=>x.trim()).filter(Boolean))]}
// Hungarian algorithm: rows <= columns
function hungarian(a){const n=a.length,m=a[0].length,u=Array(n+1).fill(0),v=Array(m+1).fill(0),p=Array(m+1).fill(0),way=Array(m+1).fill(0);for(let i=1;i<=n;i++){p[0]=i;let j0=0,minv=Array(m+1).fill(Infinity),used=Array(m+1).fill(false);do{used[j0]=true;const i0=p[j0];let delta=Infinity,j1=0;for(let j=1;j<=m;j++){if(!used[j]){const cur=a[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0}if(minv[j]<delta){delta=minv[j];j1=j}}}for(let j=0;j<=m;j++){if(used[j]){u[p[j]]+=delta;v[j]-=delta}else minv[j]-=delta}j0=j1}while(p[j0]!==0);do{const j1=way[j0];p[j0]=p[j1];j0=j1}while(j0!==0)}const ans=Array(n).fill(-1);for(let j=1;j<=m;j++)if(p[j])ans[p[j]-1]=j-1;return ans}
function assign(names){
 const performerSet=new Set(names), fixed=new Map(), original=new Set(), used=new Set();
 const specialFive=['佐藤広花','安座間結','水津菜月','北澤百音','磯崎菜々'].every(x=>performerSet.has(x));
 // 本ポジ本人の出演を優先。ただし北村優羽は藤崎未夢不在時にスライドする。
 for(const name of names){if(allPositions.includes(name))original.add(name)}
 function lock(name,pos){if(!performerSet.has(name)||used.has(pos))return false;fixed.set(name,pos);used.add(pos);original.delete(name);return true}
 if(performerSet.has('北村優羽')&&!performerSet.has('藤崎未夢'))lock('北村優羽','藤崎未夢');
 // 既存の実演確認済み特別条件を維持
 if(specialFive){lock('磯崎菜々','喜多花恵');lock('佐藤広花','木本優菜');lock('安座間結','北村優羽')}
 if(performerSet.has('水津菜月')&&performerSet.has('北澤百音'))lock('北澤百音','鈴木凛々花');
 // 本ポジ本人がいる枠を予約（スライド済みの北村優羽ポジは空ける）
 for(const name of original)used.add(name);
 const remaining=names.filter(x=>!fixed.has(x)&&!original.has(x));
 const free=allPositions.filter(p=>!used.has(p));
 const BIG=1e8,UNASSIGNED=100000;
 const columns=[...free,...remaining.map((_,i)=>'（未割当）'+i)];
 const costs=remaining.map((name,i)=>columns.map((pos,j)=>{
  if(j>=free.length)return UNASSIGNED+j;
  const r=positionPrefs[pos].indexOf(name);
  if(r<0)return BIG+j;
  // ポジション側の順位を主軸とし、同点時はメンバー側の希望順を参考にする
  const personal=prefs[name]?.indexOf(pos)??-1;
  return r*1000+(personal<0?99:personal*10)+j;
 }));
 const matched=remaining.length?hungarian(costs):[];
 const rows=names.map(name=>{
  if(fixed.has(name))return {name,position:fixed.get(name),rank:1};
  if(original.has(name))return {name,position:'オリジナル',rank:null};
  const i=remaining.indexOf(name),j=matched[i];
  if(i<0||j<0||j>=free.length||costs[i][j]>=UNASSIGNED)return {name,position:'オリジナル',rank:null};
  return {name,position:free[j],rank:positionPrefs[free[j]].indexOf(name)+1};
 });
 return {pos:allPositions,rows,unknown:names.filter(x=>!prefs[x]&&!allPositions.includes(x))};
}
document.getElementById('run').onclick=()=>{const names=splitNames(document.getElementById('performers').value);const {rows}=assign(names);const el=document.getElementById('result');if(!names.length){el.innerHTML='<h2>割り当て結果</h2><p class="err">出演メンバーを入力してください。</p>';return}let html='<h2>割り当て結果</h2><p><span class="pill">'+rows.filter(r=>r.rank).length+'名を割り当て</span>　オリジナル '+rows.filter(r=>!r.rank).length+'名</p>';html+='<div style="overflow-x:auto"><table><thead><tr><th>出演メンバー</th><th>担当ポジション</th></tr></thead><tbody>';for(const r of rows)html+='<tr><td>'+esc(r.name)+'</td><td>'+esc(r.position)+'</td></tr>';html+='</tbody></table></div><p class="muted">割り当ては本ポジション側の候補順位を優先し、出演者全体で重複を防ぎます。これは現時点の登録データに基づく試作で、公式のポジション情報を保証するものではありません。</p>';el.innerHTML=html};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let ph='<table><thead><tr><th>本ポジション</th><th>アンダー優先順位</th></tr></thead><tbody>';for(const [p,ns] of Object.entries(positionPrefs))ph+='<tr><td>'+esc(p)+'</td><td>'+ns.map((n,i)=>(i+1)+'位 '+esc(n)).join('<br>')+'</td></tr>';document.getElementById('prefs').innerHTML=ph+'</tbody></table>';
</script></body></html>
